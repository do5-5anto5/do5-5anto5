name: Atualizar GitHub Stats

on:
  schedule:
    - cron: "0 4 * * *"      # Todo dia às 4h da manhã
  workflow_dispatch:         # Permite executar manualmente

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Gerar Stats Card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: "username=do5-5anto5&show_icons=true&theme=dark&hide_border=true&include_all_commits=true"
          path: assets/stats.svg

      - name: Gerar Top Languages
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: languages
          options: "username=do5-5anto5&show_icons=true&theme=dark&hide_border=true&layout=compact"
          path: assets/top-langs.svg

      - name: Commit e Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "Atualizar GitHub Stats cards" || exit 0
          git push
